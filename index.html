<!DOCTYPE html>
<html lang="zh-Hant">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Teacher Cristine's Learning Hub</title>
 <style>
  * {
   box-sizing: border-box;
  }
  body {
   font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
   background-color: #fff0f5;
   margin: 0;
   padding: 2vh 2vw;
   min-height: 100vh;
   display: flex;
  }
  .container {
   text-align: center;
   background: #ffffff;
   padding: 3rem;
   border-radius: 24px;
   box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
   width: 100%;
   min-height: calc(100vh - 4vh);
   border: 4px solid #ffb6c1;
   display: flex;
   flex-direction: column;
   justify-content: center;
  }
  h1 {
   color: #d81b60;
   margin-top: 0;
   margin-bottom: 2.5rem;
   font-size: clamp(2.5rem, 4vw, 4rem);
   text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.6);
  }
  .games-grid {
   display: grid;
   /* Larger minimum card width (280px) so cards scale up on big screens */
   grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
   gap: 2rem;
   width: 100%;
   flex-grow: 1;
   align-content: center;
  }
  .game-card {
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: space-between;
   background-color: #fff5f8;
   border: 3px dashed #ff80ab;
   border-radius: 16px;
   padding: 18px;
   width: 100%;
   text-decoration: none;
   transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
  }
  .game-card:hover {
   transform: translateY(-6px);
   background-color: #ffe4e1;
   box-shadow: 0 8px 16px rgba(255, 105, 180, 0.3);
  }
  .game-cover {
   width: 100%;
   height: 200px; /* Doubled height from 100px for bigger visuals */
   object-fit: cover;
   border-radius: 12px;
   margin-bottom: 15px;
   box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  }
  .game-title {
   color: #ad1457;
   font-weight: bold;
   font-size: 1.35rem; /* Increased font size for classroom visibility */
   text-align: center;
   word-break: break-word;
  }
 </style>
</head>
<body>
 <div class="container">
  <h1>Teacher Cristine's Learning Hub</h1>
  
  <div class="games-grid">
   <!-- 1. Bingo -->
   <a href="bingo.html" class="game-card">
    <img src="bingo-cover.jpg" alt="Bingo Speaking Task" class="game-cover">
    <span class="game-title">bingo speaking task</span>
   </a>

   <!-- 2. Fruits Spelling -->
   <a href="502.html" class="game-card">

    <span class="game-title">fruits spelling</span>
   </a>

   <!-- 3. Sentence L1-L2 -->
   <a href="sentencebuilding.html" class="game-card">
    <img src="gamecover.gif" alt="Sentence L1-L2" class="game-cover">
    <span class="game-title">SENTENCE L1-L2</span>
   </a>

   <!-- 4. Eat Smart -->
   <a href="eatsmart.html" class="game-card">
    <img src="covereat.gif" alt="Eat Smart" class="game-cover">
    <span class="game-title">EAT SMART</span>
   </a>

   <!-- 5. Halloween Mission -->
   <a href="halloween.html" class="game-card">
    <img src="cover.gif" alt="Halloween Mission" class="game-cover">
    <span class="game-title">Halloween Mission</span>
   </a>

   <!-- 6. Halloween Family Feud -->
   <a href="halloweenfeud.html" class="game-card">
    <img src="cover-photo.jpg" alt="Halloween Family Feud" class="game-cover">
    <span class="game-title">Halloween Family Feud</span>
   </a>

   <!-- 7. What Time Is It? -->
   <a href="time.html" class="game-card">
    <img src="cover-background.jpg" alt="What Time Is It?" class="game-cover">
    <span class="game-title">What Time Is It?</span>
   </a>

   <!-- 8. Mission 2 -->
   <a href="poptheletters.html" class="game-card">
    <img src="cover_image.jpg" alt="Mission 2" class="game-cover">
    <span class="game-title">MISSION 2</span>
   </a>

   <!-- 9. Rubik's Cube -->
   <a href="phonicsrubiks.html" class="game-card">
    <img src="rubiks-cover.jpg" alt="Rubik's Cube" class="game-cover">
    <span class="game-title">RUBIK'S CUBE</span>
   </a>

   <!-- 10. ChungShan Market -->
   <a href="chungshanmarket.html" class="game-card">
    <img src="coverphoto_market.jpg" alt="ChungShan Market" class="game-cover">
    <span class="game-title">ChungShan Market</span>

       <!-- 11. Flick the Letter -->

    <span class="game-title">Flick the Letter</span>

     <!-- 12. Rubik's Phonics -->
   <a href="rubiksoyoi.html" class="game-card">
    <img src="rubik.jpg" alt="Rubik's Phonics" class="game-cover">
    <span class="game-title">Rubik's Phonics</span>

     <!-- 13. Mission 5 -->
   <a href="mission5.html" class="game-card">
    <img src="recordcover.gif" alt="Mission 5" class="game-cover">
    <span class="game-title">Mission 5</span>
   </a>
  </div>
 </div>
</body>
</html>
