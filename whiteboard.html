<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Split-Screen Whiteboard &amp; Binocular Shadow Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* =========================================================
       COMIC SANS MS & CHEERFUL PASTEL CLASSROOM THEME
       ========================================================= */
    :root {
      --font-comic: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: var(--font-comic);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffe4ef;
    }

    /* Full-screen Game Background: bg_whiteboard.jpeg with cheerful pastel fallback */
    .game-bg {
      background-image:
        url('bg_whiteboard.jpeg'),
        radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.65) 0%, transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(254, 240, 138, 0.5) 0%, transparent 45%),
        linear-gradient(135deg, #ffd6e7 0%, #ffe8f3 38%, #e0f2fe 72%, #fef3c7 100%);
      background-size: cover, 100% 100%, 100% 100%, 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Graceful pastel fallback behind cover_whiteboard.gif (no blocking text) */
    .cover-bg {
      background-image:
        url('cover_whiteboard.gif'),
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.6) 0%, transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(254, 215, 170, 0.55) 0%, transparent 45%),
        linear-gradient(135deg, #fbcfe8 0%, #fde68a 50%, #bae6fd 100%);
      background-size: cover, 100% 100%, 100% 100%, 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Playful 3D Classroom Buttons */
    .btn-3d {
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    }
    .btn-3d:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }
    .btn-3d:active {
      transform: translateY(3px);
    }

    .btn-start {
      background: linear-gradient(180deg, #ff7eb6 0%, #ec4899 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 7px 0 #be185d, 0 14px 28px rgba(190, 24, 93, 0.38);
    }
    .btn-start:active {
      box-shadow: 0 2px 0 #be185d, 0 6px 14px rgba(190, 24, 93, 0.35);
    }

    .btn-pink {
      background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
      box-shadow: 0 4px 0 #9d174d;
    }
    .btn-pink:active { box-shadow: 0 1px 0 #9d174d; }

    .btn-sky {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
      box-shadow: 0 4px 0 #1e40af;
    }
    .btn-sky:active { box-shadow: 0 1px 0 #1e40af; }

    .btn-amber {
      background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 100%);
      box-shadow: 0 4px 0 #b45309;
    }
    .btn-amber:active { box-shadow: 0 1px 0 #b45309; }

    .btn-mint {
      background: linear-gradient(180deg, #34d399 0%, #059669 100%);
      box-shadow: 0 4px 0 #065f46;
    }
    .btn-mint:active { box-shadow: 0 1px 0 #065f46; }

    /* Realistic Lined Notebook Pad Paper */
    .notebook-paper {
      background-color: #ffffff;
      background-image:
        /* Vertical pink/red margin line */
        linear-gradient(to right, transparent 42px, rgba(244, 63, 94, 0.45) 42px, rgba(244, 63, 94, 0.45) 44px, transparent 44px),
        /* Horizontal blue notebook lines */
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 31px,
          rgba(59, 130, 246, 0.30) 31px,
          rgba(59, 130, 246, 0.30) 33px
        );
      background-position: 0 0, 0 12px;
    }

    /* Spiral Notebook Rings Along Top Edge */
    .spiral-top {
      background: linear-gradient(180deg, #fce7f3 0%, #fbcfe8 100%);
      background-image: radial-gradient(circle at 15px 11px, #475569 4px, transparent 4.5px);
      background-size: 30px 20px;
      background-repeat: repeat-x;
      position: relative;
    }
    .spiral-top::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -6px;
      height: 16px;
      background-image: repeating-linear-gradient(
        to right,
        transparent 0px,
        transparent 12px,
        #64748b 12px,
        #cbd5e1 15px,
        #475569 18px,
        transparent 18px,
        transparent 30px
      );
      pointer-events: none;
    }

    /* Illuminated Paper Card Behind Shadow Silhouette */
    .shadow-light-card {
      background: radial-gradient(circle at center, #ffffff 0%, #fffbeb 68%, #fef3c7 100%);
      box-shadow: 0 0 60px rgba(255, 251, 235, 0.5);
    }

    /* Shadow / Silhouette CSS Filter for Binocular Phase */
    .shadow-mode .s-fill { fill: #111827 !important; }
    .shadow-mode .s-stroke { stroke: #111827 !important; }
    .shadow-mode .s-cutout { fill: #fffdf7 !important; }
    .shadow-mode .s-cutout-stroke { stroke: #fffdf7 !important; }
    .shadow-mode .s-text { fill: #fffdf7 !important; }
    .shadow-mode .s-dark-text { fill: #111827 !important; }

    /* Drawing Canvas (Transparent over CSS notebook lines) */
    .draw-canvas {
      touch-action: none;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
    }
    .draw-canvas.eraser-cursor {
      cursor: cell;
    }

    /* Active Tool & Swatch Highlight */
    .tool-active {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%) !important;
      color: #1f2937 !important;
      border-color: #b45309 !important;
      box-shadow: 0 3px 0 #b45309;
      transform: scale(1.04);
    }
    .swatch-active {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
      transform: scale(1.16);
    }
    .size-active {
      background-color: #ec4899 !important;
      color: #ffffff !important;
      border-color: #be185d !important;
    }

    /* Editable Team Name */
    .team-input {
      background: rgba(255, 255, 255, 0.5);
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      user-select: text;
      transition: background 0.15s, border-color 0.15s;
    }
    .team-input:focus, .team-input:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #ec4899;
      outline: none;
    }

    /* Animations */
    @keyframes bounceGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-gentle {
      animation: bounceGentle 2.2s ease-in-out infinite;
    }

    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .animate-urgent {
      animation: pulseUrgent 0.45s ease-in-out infinite;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.86) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.26s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="game-bg text-slate-800">

  <!-- =========================================================
       SCREEN 1: BLANK FULL-SCREEN COVER PAGE + START BUTTON ONLY
       ========================================================= -->
  <section id="screen-cover" class="fixed inset-0 z-30 cover-bg w-screen h-screen overflow-hidden">
    <!-- User's cover_whiteboard.gif stretched across the ENTIRE viewport -->
    <img
      id="cover-photo"
      src="cover_whiteboard.gif"
      alt=""
      onerror="this.style.display='none';"
      style="width: 100vw; height: 100vh; object-fit: cover; position: fixed; inset: 0;"
      class="pointer-events-none"
    />

    <!-- ONLY a single prominent, playful START button near bottom-center -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40">
      <button
        id="btn-start"
        onclick="startGame()"
        class="btn-3d btn-start animate-bounce-gentle text-white text-3xl sm:text-4xl font-bold px-12 sm:px-16 py-4 rounded-full tracking-wider flex items-center gap-3 cursor-pointer"
      >
        <span>▶</span>
        <span>START</span>
      </button>
    </div>
  </section>

  <!-- =========================================================
       SCREEN 2: 7-SECOND FAST-PACED BINOCULAR SHADOW GAME
       ========================================================= -->
  <section id="screen-binocular" class="fixed inset-0 z-20 hidden flex-col items-center justify-center overflow-hidden game-bg">
    <!-- Illuminated Card Holding the High-Contrast Silhouette -->
    <div class="relative w-full h-full flex items-center justify-center p-4">
      <div class="shadow-light-card rounded-[2.5rem] w-[86vw] max-w-[760px] h-[72vh] max-h-[560px] flex items-center justify-center p-6 sm:p-10">
        <div id="shadow-svg-holder" class="shadow-mode w-full h-full flex items-center justify-center pointer-events-none select-none">
          <!-- Custom SVG injected per round -->
        </div>
      </div>

      <!-- Blackout Overlay with Fast-Moving Binocular Viewport Cutout -->
      <canvas id="binocular-canvas" class="fixed inset-0 w-full h-full pointer-events-none"></canvas>

      <!-- Top HUD Overlay -->
      <div class="fixed top-4 left-4 right-4 z-30 flex items-center justify-between gap-2 pointer-events-none">
        <!-- Round Indicator -->
        <div class="bg-pink-500/90 border-2 border-white text-white px-4 py-2 rounded-2xl text-base sm:text-xl font-bold shadow-lg flex items-center gap-2">
          <span>🔭</span>
          <span id="bino-round-label">Round 1 / 15</span>
        </div>

        <!-- Crisp 7-Second Countdown Timer -->
        <div id="bino-timer-badge" class="bg-amber-300 text-slate-900 border-4 border-white px-6 py-1.5 rounded-full text-3xl sm:text-5xl font-bold shadow-2xl min-w-[88px] text-center">
          7
        </div>

        <!-- Mute & Skip Controls -->
        <div class="flex items-center gap-2 pointer-events-auto">
          <button onclick="toggleMute()" class="btn-3d bg-white/90 border-2 border-pink-300 text-slate-800 px-3 py-2 rounded-xl font-bold text-base shadow-lg cursor-pointer" title="Toggle Sound">
            <span class="mute-icon">🔊</span>
          </button>
          <button onclick="skipToWhiteboard()" class="btn-3d btn-sky text-white border-2 border-white px-4 py-2 rounded-xl font-bold text-sm sm:text-base shadow-lg cursor-pointer">
            Skip to Board ➔
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- =========================================================
       SCREEN 3: SPLIT-SCREEN LINED NOTEBOOK WHITEBOARD
       ========================================================= -->
  <section id="screen-whiteboard" class="fixed inset-0 z-10 hidden flex-col h-full w-full p-2 sm:p-3 gap-2 game-bg">

    <!-- TOP BAR: ADJUSTABLE SCOREBOARD + COMPACT TEACHER CONTROLS -->
    <header class="shrink-0 w-full bg-white/90 backdrop-blur-md border-2 border-pink-300 rounded-2xl px-2 sm:px-3 py-1.5 shadow-lg flex flex-wrap lg:flex-nowrap items-center justify-between gap-2">

      <!-- LEFT: TEAM 1 SCORE -->
      <div class="flex items-center gap-1.5 sm:gap-2 bg-sky-100 border-2 border-sky-300 rounded-xl px-2 py-1">
        <input
          id="team1-name"
          type="text"
          value="Team 1"
          aria-label="Team 1 Name"
          class="team-input text-sky-900 font-bold text-sm sm:text-base w-20 sm:w-24 px-1.5 py-0.5"
        />
        <button onclick="adjustScore(1, -1)" class="btn-3d w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-rose-400 hover:bg-rose-500 text-white font-bold text-lg flex items-center justify-center shadow cursor-pointer" title="Subtract 1">−</button>
        <span id="score-1" class="text-sky-900 font-bold text-xl sm:text-3xl min-w-[28px] sm:min-w-[38px] text-center">0</span>
        <button onclick="adjustScore(1, 1)" class="btn-3d w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg flex items-center justify-center shadow cursor-pointer" title="Add 1">+</button>
      </div>

      <!-- CENTER: COMPACT TEACHER CONTROLS -->
      <div class="flex flex-wrap items-center justify-center gap-1.5">
        <span id="wb-round-label" class="bg-pink-100 border-2 border-pink-300 text-pink-800 px-2.5 py-1 rounded-xl font-bold text-xs sm:text-sm">
          Round 1 / 15
        </span>
        <button onclick="replayBinoculars()" class="btn-3d btn-sky text-white px-2.5 sm:px-3 py-1 rounded-xl font-bold text-xs sm:text-sm cursor-pointer" title="Replay 7-second Binoculars">
          🔭 Replay Binoculars (7s)
        </button>
        <button onclick="revealAnswer()" class="btn-3d btn-amber text-slate-900 px-2.5 sm:px-3 py-1 rounded-xl font-bold text-xs sm:text-sm cursor-pointer" title="Reveal Answer">
          ✨ Reveal Answer
        </button>
        <button id="btn-next-top" onclick="nextRound()" class="btn-3d btn-mint text-white px-2.5 sm:px-3 py-1 rounded-xl font-bold text-xs sm:text-sm cursor-pointer" title="Next Round">
          <span id="next-round-label">Next Round ➔</span>
        </button>
        <button onclick="toggleMute()" class="btn-3d bg-pink-100 hover:bg-pink-200 border border-pink-300 text-slate-800 px-2.5 py-1 rounded-xl font-bold text-xs sm:text-sm cursor-pointer" title="Toggle Sound">
          <span class="mute-icon">🔊</span>
        </button>
        <button onclick="goHome()" class="btn-3d bg-pink-100 hover:bg-pink-200 border border-pink-300 text-slate-800 px-2.5 py-1 rounded-xl font-bold text-xs sm:text-sm cursor-pointer" title="Home">
          🏠 Home
        </button>
      </div>

      <!-- RIGHT: TEAM 2 SCORE -->
      <div class="flex items-center gap-1.5 sm:gap-2 bg-pink-100 border-2 border-pink-300 rounded-xl px-2 py-1">
        <button onclick="adjustScore(2, -1)" class="btn-3d w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-rose-400 hover:bg-rose-500 text-white font-bold text-lg flex items-center justify-center shadow cursor-pointer" title="Subtract 1">−</button>
        <span id="score-2" class="text-pink-900 font-bold text-xl sm:text-3xl min-w-[28px] sm:min-w-[38px] text-center">0</span>
        <button onclick="adjustScore(2, 1)" class="btn-3d w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg flex items-center justify-center shadow cursor-pointer" title="Add 1">+</button>
        <input
          id="team2-name"
          type="text"
          value="Team 2"
          aria-label="Team 2 Name"
          class="team-input text-pink-900 font-bold text-sm sm:text-base w-20 sm:w-24 px-1.5 py-0.5 text-right"
        />
      </div>
    </header>

    <!-- MIDDLE AREA: SPLIT-SCREEN LINED NOTEBOOK PADS -->
    <main class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 gap-2.5 sm:gap-3">

      <!-- =====================================================
           LEFT NOTEBOOK PAD (TEAM 1)
           ===================================================== -->
      <div class="flex flex-col min-h-0 rounded-2xl overflow-hidden shadow-xl border-[3px] border-sky-300 bg-white">
        <!-- Spiral Notebook Rings at Top -->
        <div class="spiral-top h-5 shrink-0 border-b border-pink-200"></div>

        <!-- Lined Notebook Drawing Area -->
        <div class="relative flex-1 min-h-0 notebook-paper overflow-hidden">
          <div class="absolute top-1.5 right-2.5 px-2.5 py-0.5 rounded-full bg-sky-100/90 border border-sky-300 text-sky-800 text-xs font-bold pointer-events-none">
            <span id="pad1-label">Team 1</span>
          </div>
          <canvas id="canvas-0" class="draw-canvas"></canvas>
        </div>

        <!-- BOTTOM DRAWING TOOLBAR (PEN, ERASER, COLORS, SIZES, CLEAR) -->
        <div class="shrink-0 bg-gradient-to-r from-sky-50 via-pink-50 to-sky-50 border-t-2 border-sky-200 px-2 py-1.5 flex flex-wrap items-center justify-between gap-1.5">
          <!-- Pen & Eraser -->
          <div class="flex items-center gap-1.5">
            <button id="pen-btn-0" onclick="selectPen(0)" class="tool-active px-2.5 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
              ✏️ Pen
            </button>
            <button id="eraser-btn-0" onclick="selectEraser(0)" class="px-2.5 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
              🧽 Eraser
            </button>
          </div>

          <!-- 6 Color Swatches -->
          <div class="flex items-center gap-1.5">
            <button onclick="setColor(0, '#1f2937', this)" data-color="#1f2937" class="swatch-0 swatch-active w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-slate-800 border-2 border-white shadow cursor-pointer" title="Black"></button>
            <button onclick="setColor(0, '#2563eb', this)" data-color="#2563eb" class="swatch-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-blue-600 border-2 border-white shadow cursor-pointer" title="Blue"></button>
            <button onclick="setColor(0, '#ef4444', this)" data-color="#ef4444" class="swatch-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-red-500 border-2 border-white shadow cursor-pointer" title="Red"></button>
            <button onclick="setColor(0, '#ec4899', this)" data-color="#ec4899" class="swatch-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-pink-500 border-2 border-white shadow cursor-pointer" title="Pink"></button>
            <button onclick="setColor(0, '#16a34a', this)" data-color="#16a34a" class="swatch-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-green-600 border-2 border-white shadow cursor-pointer" title="Green"></button>
            <button onclick="setColor(0, '#9333ea', this)" data-color="#9333ea" class="swatch-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-purple-600 border-2 border-white shadow cursor-pointer" title="Purple"></button>
          </div>

          <!-- Sizes (S / M / L) & Clear -->
          <div class="flex items-center gap-1">
            <button onclick="setSize(0, 0, this)" class="size-0 w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Small">S</button>
            <button onclick="setSize(0, 1, this)" class="size-0 size-active w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Medium">M</button>
            <button onclick="setSize(0, 2, this)" class="size-0 w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Large">L</button>
            <button onclick="clearPad(0)" class="ml-1 px-2.5 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-700 font-bold text-xs sm:text-sm cursor-pointer" title="Clear Board">
              🗑️ Clear
            </button>
          </div>
        </div>
      </div>

      <!-- =====================================================
           RIGHT NOTEBOOK PAD (TEAM 2)
           ===================================================== -->
      <div class="flex flex-col min-h-0 rounded-2xl overflow-hidden shadow-xl border-[3px] border-pink-300 bg-white">
        <!-- Spiral Notebook Rings at Top -->
        <div class="spiral-top h-5 shrink-0 border-b border-pink-200"></div>

        <!-- Lined Notebook Drawing Area -->
        <div class="relative flex-1 min-h-0 notebook-paper overflow-hidden">
          <div class="absolute top-1.5 right-2.5 px-2.5 py-0.5 rounded-full bg-pink-100/90 border border-pink-300 text-pink-800 text-xs font-bold pointer-events-none">
            <span id="pad2-label">Team 2</span>
          </div>
          <canvas id="canvas-1" class="draw-canvas"></canvas>
        </div>

        <!-- BOTTOM DRAWING TOOLBAR (PEN, ERASER, COLORS, SIZES, CLEAR) -->
        <div class="shrink-0 bg-gradient-to-r from-pink-50 via-amber-50 to-pink-50 border-t-2 border-pink-200 px-2 py-1.5 flex flex-wrap items-center justify-between gap-1.5">
          <!-- Pen & Eraser -->
          <div class="flex items-center gap-1.5">
            <button id="pen-btn-1" onclick="selectPen(1)" class="tool-active px-2.5 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
              ✏️ Pen
            </button>
            <button id="eraser-btn-1" onclick="selectEraser(1)" class="px-2.5 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
              🧽 Eraser
            </button>
          </div>

          <!-- 6 Color Swatches -->
          <div class="flex items-center gap-1.5">
            <button onclick="setColor(1, '#1f2937', this)" data-color="#1f2937" class="swatch-1 swatch-active w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-slate-800 border-2 border-white shadow cursor-pointer" title="Black"></button>
            <button onclick="setColor(1, '#2563eb', this)" data-color="#2563eb" class="swatch-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-blue-600 border-2 border-white shadow cursor-pointer" title="Blue"></button>
            <button onclick="setColor(1, '#ef4444', this)" data-color="#ef4444" class="swatch-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-red-500 border-2 border-white shadow cursor-pointer" title="Red"></button>
            <button onclick="setColor(1, '#ec4899', this)" data-color="#ec4899" class="swatch-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-pink-500 border-2 border-white shadow cursor-pointer" title="Pink"></button>
            <button onclick="setColor(1, '#16a34a', this)" data-color="#16a34a" class="swatch-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-green-600 border-2 border-white shadow cursor-pointer" title="Green"></button>
            <button onclick="setColor(1, '#9333ea', this)" data-color="#9333ea" class="swatch-1 w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-purple-600 border-2 border-white shadow cursor-pointer" title="Purple"></button>
          </div>

          <!-- Sizes (S / M / L) & Clear -->
          <div class="flex items-center gap-1">
            <button onclick="setSize(1, 0, this)" class="size-1 w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Small">S</button>
            <button onclick="setSize(1, 1, this)" class="size-1 size-active w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Medium">M</button>
            <button onclick="setSize(1, 2, this)" class="size-1 w-7 h-7 rounded-lg bg-white border border-pink-300 text-slate-700 font-bold text-xs cursor-pointer" title="Large">L</button>
            <button onclick="clearPad(1)" class="ml-1 px-2.5 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-700 font-bold text-xs sm:text-sm cursor-pointer" title="Clear Board">
              🗑️ Clear
            </button>
          </div>
        </div>
      </div>

    </main>
  </section>

  <!-- =========================================================

       2. WEB AUDIO SOUND EFFECTS (TICK / WHOOSH / BELL / FANFARE)
       =========================================================== */
    let audioCtx = null;
    let isMuted = false;

    function ensureAudio() {
      try {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        // Ignore audio errors on restricted devices
      }
    }

    function playTone(freq, duration, type = 'sine', volume = 0.14, delay = 0) {
      if (isMuted) return;
      ensureAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      } catch (err) {
        // Ignore playback errors
      }
    }

    function sfxClick() { playTone(620, 0.07, 'triangle', 0.12); }

    function sfxWhoosh() {
      if (isMuted) return;
      ensureAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.18);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      } catch (err) {}
    }

    function sfxTick(urgent) {
      playTone(urgent ? 920 : 540, urgent ? 0.12 : 0.08, 'triangle', urgent ? 0.14 : 0.10);
    }

    function sfxBell() {
      playTone(784, 0.16, 'sine', 0.18, 0);
      playTone(1046.5, 0.35, 'sine', 0.20, 0.12);
    }

    function sfxScore(up) {
      if (up) {
        playTone(659.25, 0.09, 'sine', 0.16, 0);
        playTone(987.77, 0.18, 'sine', 0.16, 0.08);
      } else {
        playTone(280, 0.12, 'sawtooth', 0.08, 0);
      }
    }

    function sfxReveal() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, 0.24, 'triangle', 0.16, i * 0.07));
    }

    function sfxVictory() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      const times = [0, 0.11, 0.22, 0.34, 0.50, 0.62];
      notes.forEach((f, i) => playTone(f, 0.26, 'triangle', 0.18, times[i]));
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.querySelectorAll('.mute-icon').forEach(el => el.textContent = isMuted ? '🔇' : '🔊');
      if (!isMuted) sfxClick();
    }

    /* ===========================================================
       3. GAME STATE & NAVIGATION
       =========================================================== */
    let currentRoundIdx = 0; // Exact order 0..14
    let scores = { 1: 0, 2: 0 };

    // Binocular loop state
    let binoAnimId = null;
    let binoTimerId = null;
    let binoTimeLeft = 7;
    let binoPos = { x: 200, y: 200, vx: 720, vy: 560, lastTime: 0, wobbleT: 0 };

    const screenCover = document.getElementById('screen-cover');
    const screenBinocular = document.getElementById('screen-binocular');
    const screenWhiteboard = document.getElementById('screen-whiteboard');
    const modalReveal = document.getElementById('modal-reveal');
    const modalWinner = document.getElementById('modal-winner');

    // Sync editable team names to pad corner badges
    document.getElementById('team1-name').addEventListener('input', (e) => {
      document.getElementById('pad1-label').textContent = e.target.value.trim() || 'Team 1';
    });
    document.getElementById('team2-name').addEventListener('input', (e) => {
      document.getElementById('pad2-label').textContent = e.target.value.trim() || 'Team 2';
    });

    function showScreen(name) {
      screenCover.classList.add('hidden');
      screenBinocular.classList.add('hidden');
      screenBinocular.classList.remove('flex');
      screenWhiteboard.classList.add('hidden');
      screenWhiteboard.classList.remove('flex');

      if (name === 'cover') {
        screenCover.classList.remove('hidden');
      } else if (name === 'binocular') {
        screenBinocular.classList.remove('hidden');
        screenBinocular.classList.add('flex');
      } else if (name === 'whiteboard') {
        screenWhiteboard.classList.remove('hidden');
        screenWhiteboard.classList.add('flex');
        requestAnimationFrame(() => {
          resizeWhiteboardCanvas(0);
          resizeWhiteboardCanvas(1);
        });
      }
    }

    function startGame() {
      sfxWhoosh();
      currentRoundIdx = 0;
      scores = { 1: 0, 2: 0 };
      updateScoreDisplay();
      clearPad(0);
      clearPad(1);
      startBinocularPhase();
    }

    function playAgain() {
      stopConfetti();
      modalWinner.classList.add('hidden');
      modalWinner.classList.remove('flex');
      startGame();
    }

    function goHome() {
      sfxClick();
      stopBinocularPhase();
      stopConfetti();
      closeRevealModal();
      modalWinner.classList.add('hidden');
      modalWinner.classList.remove('flex');
      showScreen('cover');
    }

    /* ===========================================================
       4. 7-SECOND FAST-PACED BINOCULAR SHADOW GAME
       =========================================================== */
    const binoCanvas = document.getElementById('binocular-canvas');
    const binoCtx = binoCanvas.getContext('2d');
    const shadowHolder = document.getElementById('shadow-svg-holder');
    const binoTimerBadge = document.getElementById('bino-timer-badge');

    function startBinocularPhase() {
      stopBinocularPhase();
      const item = ITEMS[currentRoundIdx];
      shadowHolder.innerHTML = item.svg;

      document.getElementById('bino-round-label').textContent = `Round ${currentRoundIdx + 1} / ${ITEMS.length}`;
      document.getElementById('wb-round-label').textContent = `Round ${currentRoundIdx + 1} / ${ITEMS.length}`;

      const isLast = currentRoundIdx === ITEMS.length - 1;
      document.getElementById('next-round-label').textContent = isLast ? 'Finish 🏆' : 'Next Round ➔';
      document.getElementById('modal-next-label').textContent = isLast ? 'See Winner 🏆' : 'Next Round ➔';

      showScreen('binocular');
      resizeBinocularCanvas();

      // Fast-paced velocity scaled to viewport
      const w = binoCanvas.width;
      const h = binoCanvas.height;
      const scale = Math.max(1, Math.min(w, h) / 680);
      const angle = (Math.random() * 0.45 + 0.22) * Math.PI + (Math.random() < 0.5 ? 0 : Math.PI);
      const speed = 740 * scale;
      binoPos = {
        x: w * 0.5,
        y: h * 0.5,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        lastTime: performance.now(),
        wobbleT: 0
      };

      // 7-second countdown
      binoTimeLeft = 7;
      updateBinoTimerUI();
      sfxTick(false);

      binoTimerId = setInterval(() => {
        binoTimeLeft--;
        if (binoTimeLeft > 0) {
          updateBinoTimerUI();
          sfxTick(binoTimeLeft <= 3);
        } else {
          stopBinocularPhase();
          sfxBell();
          showScreen('whiteboard');
        }
      }, 1000);

      binoAnimId = requestAnimationFrame(renderBinoculars);
    }

    function updateBinoTimerUI() {
      binoTimerBadge.textContent = binoTimeLeft;
      if (binoTimeLeft <= 3) {
        binoTimerBadge.classList.remove('bg-amber-300', 'text-slate-900');
        binoTimerBadge.classList.add('bg-rose-500', 'text-white', 'animate-urgent');
      } else {
        binoTimerBadge.classList.add('bg-amber-300', 'text-slate-900');
        binoTimerBadge.classList.remove('bg-rose-500', 'text-white', 'animate-urgent');
      }
    }

    function stopBinocularPhase() {
      if (binoAnimId) {
        cancelAnimationFrame(binoAnimId);
        binoAnimId = null;
      }
      if (binoTimerId) {
        clearInterval(binoTimerId);
        binoTimerId = null;
      }
    }

    function skipToWhiteboard() {
      sfxClick();
      stopBinocularPhase();
      showScreen('whiteboard');
    }

    function replayBinoculars() {
      sfxWhoosh();
      startBinocularPhase();
    }

    function resizeBinocularCanvas() {
      if (screenBinocular.classList.contains('hidden')) return;
      binoCanvas.width = window.innerWidth;
      binoCanvas.height = window.innerHeight;
    }

    function renderBinoculars(now) {
      const dt = Math.min(0.05, (now - binoPos.lastTime) / 1000);
      binoPos.lastTime = now;
      binoPos.wobbleT += dt * 5.2;

      const w = binoCanvas.width;
      const h = binoCanvas.height;

      const lensRadius = Math.max(66, Math.min(w, h) * 0.155);
      const lensOffset = lensRadius * 0.72;

      // Sweep rapidly across the illuminated card area
      const minX = Math.max(lensRadius + lensOffset, w * 0.15);
      const maxX = Math.min(w - lensRadius - lensOffset, w * 0.85);
      const minY = Math.max(lensRadius + 64, h * 0.16);
      const maxY = Math.min(h - lensRadius - 36, h * 0.84);

      binoPos.x += (binoPos.vx + Math.sin(binoPos.wobbleT) * 165) * dt;
      binoPos.y += (binoPos.vy + Math.cos(binoPos.wobbleT * 1.35) * 165) * dt;

      if (binoPos.x < minX) {
        binoPos.x = minX;
        binoPos.vx = Math.abs(binoPos.vx) * (0.95 + Math.random() * 0.12);
      } else if (binoPos.x > maxX) {
        binoPos.x = maxX;
        binoPos.vx = -Math.abs(binoPos.vx) * (0.95 + Math.random() * 0.12);
      }

      if (binoPos.y < minY) {
        binoPos.y = minY;
        binoPos.vy = Math.abs(binoPos.vy) * (0.95 + Math.random() * 0.12);
      } else if (binoPos.y > maxY) {
        binoPos.y = maxY;
        binoPos.vy = -Math.abs(binoPos.vy) * (0.95 + Math.random() * 0.12);
      }

      // Maintain brisk speed
      const maxSpd = Math.max(820, Math.min(w, h) * 1.32);
      const minSpd = Math.max(580, Math.min(w, h) * 0.90);
      const curSpd = Math.hypot(binoPos.vx, binoPos.vy);
      if (curSpd > maxSpd) {
        binoPos.vx = (binoPos.vx / curSpd) * maxSpd;
        binoPos.vy = (binoPos.vy / curSpd) * maxSpd;
      } else if (curSpd < minSpd) {
        binoPos.vx = (binoPos.vx / curSpd) * minSpd;
        binoPos.vy = (binoPos.vy / curSpd) * minSpd;
      }

      const lx = binoPos.x - lensOffset;
      const rx = binoPos.x + lensOffset;
      const cy = binoPos.y;

      // 1. Dark blackout overlay
      binoCtx.globalCompositeOperation = 'source-over';
      binoCtx.fillStyle = '#0f172a';
      binoCtx.fillRect(0, 0, w, h);

      // 2. Cut out two overlapping circular binocular lenses
      binoCtx.globalCompositeOperation = 'destination-out';
      binoCtx.beginPath();
      binoCtx.arc(lx, cy, lensRadius, 0, Math.PI * 2);
      binoCtx.arc(rx, cy, lensRadius, 0, Math.PI * 2);
      binoCtx.fill();

      // 3. Subtle lens vignette, rim & glass glint
      binoCtx.globalCompositeOperation = 'source-over';
      [lx, rx].forEach(cx => {
        const grad = binoCtx.createRadialGradient(cx, cy, lensRadius * 0.65, cx, cy, lensRadius);
        grad.addColorStop(0, 'rgba(15, 23, 42, 0)');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0.55)');
        binoCtx.fillStyle = grad;
        binoCtx.beginPath();
        binoCtx.arc(cx, cy, lensRadius, 0, Math.PI * 2);
        binoCtx.fill();

        // Outer lens ring
        binoCtx.strokeStyle = 'rgba(244, 114, 182, 0.6)';
        binoCtx.lineWidth = 5;
        binoCtx.beginPath();
        binoCtx.arc(cx, cy, lensRadius - 2, 0, Math.PI * 2);
        binoCtx.stroke();

        // Subtle curved glass highlight
        binoCtx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
        binoCtx.lineWidth = 4;
        binoCtx.lineCap = 'round';
        binoCtx.beginPath();
        binoCtx.arc(cx, cy, lensRadius * 0.78, Math.PI * 1.15, Math.PI * 1.42);
        binoCtx.stroke();
      });

      binoAnimId = requestAnimationFrame(renderBinoculars);
    }

    /* ===========================================================
       5. SCOREBOARD, REVEAL ANSWER & ROUND PROGRESSION
       =========================================================== */
    function adjustScore(team, delta) {
      scores[team] = Math.max(0, scores[team] + delta);
      updateScoreDisplay();
      sfxScore(delta > 0);
    }

    function updateScoreDisplay() {
      document.getElementById('score-1').textContent = scores[1];
      document.getElementById('score-2').textContent = scores[2];
    }

    function revealAnswer() {
      sfxReveal();
      const item = ITEMS[currentRoundIdx];
      document.getElementById('reveal-svg-holder').innerHTML = item.svg;
      document.getElementById('reveal-word').textContent = item.answer;
      document.getElementById('reveal-subtitle').textContent = item.subtitle;

      const t1 = document.getElementById('team1-name').value.trim() || 'Team 1';
      const t2 = document.getElementById('team2-name').value.trim() || 'Team 2';
      document.getElementById('award-t1-name').textContent = t1;
      document.getElementById('award-t2-name').textContent = t2;

      modalReveal.classList.remove('hidden');
      modalReveal.classList.add('flex');
    }

    function closeRevealModal() {
      modalReveal.classList.add('hidden');
      modalReveal.classList.remove('flex');
    }

    function awardPoints(target, btnEl) {
      if (target === 't1') {
        scores[1]++;
      } else if (target === 't2') {
        scores[2]++;
      } else if (target === 'both') {
        scores[1]++;
        scores[2]++;
      }
      updateScoreDisplay();
      sfxScore(true);

      // Brief visual feedback pulse on clicked button
      if (btnEl) {
        btnEl.style.transform = 'scale(1.12)';
        setTimeout(() => { btnEl.style.transform = ''; }, 180);
      }
    }

    function nextRound() {
      sfxWhoosh();
      clearPad(0);
      clearPad(1);
      if (currentRoundIdx < ITEMS.length - 1) {
        currentRoundIdx++;
        startBinocularPhase();
      } else {
        showWinnerModal();
      }
    }

    function showWinnerModal() {
      const t1Name = document.getElementById('team1-name').value.trim() || 'Team 1';
      const t2Name = document.getElementById('team2-name').value.trim() || 'Team 2';

      document.getElementById('final-t1-name').textContent = t1Name;
      document.getElementById('final-t2-name').textContent = t2Name;
      document.getElementById('final-t1-score').textContent = scores[1];
      document.getElementById('final-t2-score').textContent = scores[2];

      const banner = document.getElementById('winner-banner');
      if (scores[1] > scores[2]) {
        banner.textContent = `🎉 ${t1Name} Wins! 🎉`;
      } else if (scores[2] > scores[1]) {
        banner.textContent = `🎉 ${t2Name} Wins! 🎉`;
      } else {
        banner.textContent = `🤝 It's a Tie! Great Teamwork! 🤝`;
      }

      modalWinner.classList.remove('hidden');
      modalWinner.classList.add('flex');
      sfxVictory();
      startConfetti();
    }

    /* ===========================================================
       6. MULTI-TOUCH SPLIT-SCREEN NOTEBOOK DRAWING SYSTEM
       Supports simultaneous multi-touch / stylus / mouse on both pads
       =========================================================== */
    const PEN_SIZES = [3.5, 7, 13];
    const ERASER_SIZES = [18, 28, 44];

    const pads = [0, 1].map((idx) => {
      const canvas = document.getElementById(`canvas-${idx}`);
      const ctx = canvas.getContext('2d');
      return {
        idx,
        canvas,
        ctx,
        mode: 'pen',          // 'pen' | 'eraser'
        color: '#1f2937',
        sizeIdx: 1,           // 0 = S, 1 = M, 2 = L
        activePointers: new Map() // pointerId -> { x, y }
      };
    });

    function getCanvasPoint(canvas, e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function resizeWhiteboardCanvas(padIdx) {
      const pad = pads[padIdx];
      const canvas = pad.canvas;
      const parent = canvas.parentElement;
      if (!parent) return;

      const rect = parent.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));

      if (canvas.width === width && canvas.height === height) return;

      // Snapshot existing ink before resizing so drawings are preserved
      let snapshot = null;
      if (canvas.width > 0 && canvas.height > 0) {
        snapshot = document.createElement('canvas');
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        snapshot.getContext('2d').drawImage(canvas, 0, 0);
      }

      canvas.width = width;
      canvas.height = height;

      if (snapshot) {
        pad.ctx.drawImage(snapshot, 0, 0);
      }
    }

    function drawSegment(pad, from, to) {
      const ctx = pad.ctx;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (pad.mode === 'eraser') {
        // Erase transparent so CSS notebook lines remain untouched!
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = ERASER_SIZES[pad.sizeIdx];
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = PEN_SIZES[pad.sizeIdx];
        ctx.strokeStyle = pad.color;
      }

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawDot(pad, pt) {
      const ctx = pad.ctx;
      ctx.save();
      if (pad.mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, ERASER_SIZES[pad.sizeIdx] / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = pad.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, PEN_SIZES[pad.sizeIdx] / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Bind Pointer Events to each canvas for true multi-touch split-screen drawing
    pads.forEach((pad) => {
      const canvas = pad.canvas;

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        const pt = getCanvasPoint(canvas, e);
        pad.activePointers.set(e.pointerId, pt);
        drawDot(pad, pt);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!pad.activePointers.has(e.pointerId)) return;
        e.preventDefault();
        const prev = pad.activePointers.get(e.pointerId);
        const curr = getCanvasPoint(canvas, e);
        drawSegment(pad, prev, curr);
        pad.activePointers.set(e.pointerId, curr);
      });

      const endStroke = (e) => {
        if (pad.activePointers.has(e.pointerId)) {
          pad.activePointers.delete(e.pointerId);
        }
      };

      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
    });

    // Bottom Toolbar Actions
    function selectPen(padIdx) {
      sfxClick();
      const pad = pads[padIdx];
      pad.mode = 'pen';
      pad.canvas.classList.remove('eraser-cursor');
      document.getElementById(`pen-btn-${padIdx}`).classList.add('tool-active');
      document.getElementById(`eraser-btn-${padIdx}`).classList.remove('tool-active');
    }

    function selectEraser(padIdx) {
      sfxClick();
      const pad = pads[padIdx];
      pad.mode = 'eraser';
      pad.canvas.classList.add('eraser-cursor');
      document.getElementById(`eraser-btn-${padIdx}`).classList.add('tool-active');
      document.getElementById(`pen-btn-${padIdx}`).classList.remove('tool-active');
    }

    function setColor(padIdx, hex, btnEl) {
      sfxClick();
      const pad = pads[padIdx];
      pad.color = hex;
      // Automatically switch back to pen when choosing a color
      selectPen(padIdx);
      document.querySelectorAll(`.swatch-${padIdx}`).forEach(el => el.classList.remove('swatch-active'));
      if (btnEl) btnEl.classList.add('swatch-active');
    }

    function setSize(padIdx, sizeIdx, btnEl) {
      sfxClick();
      pads[padIdx].sizeIdx = sizeIdx;
      document.querySelectorAll(`.size-${padIdx}`).forEach(el => el.classList.remove('size-active'));
      if (btnEl) btnEl.classList.add('size-active');
    }

    function clearPad(padIdx) {
      sfxClick();
      const pad = pads[padIdx];
      pad.ctx.clearRect(0, 0, pad.canvas.width, pad.canvas.height);
    }

    /* ===========================================================
       7. CELEBRATORY CONFETTI ANIMATION FOR WINNER MODAL
       =========================================================== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiAnimId = null;
    let confettiPieces = [];

    function startConfetti() {
      stopConfetti();
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      const colors = ['#ec4899', '#38bdf8', '#facc15', '#34d399', '#a855f7', '#fb7185', '#f97316'];
      confettiPieces = Array.from({ length: 130 }, () => ({
        x: Math.random() * confettiCanvas.width,
        y: Math.random() * -confettiCanvas.height,
        w: 8 + Math.random() * 8,
        h: 6 + Math.random() * 10,
        vx: (Math.random() - 0.5) * 3,
        vy: 2.5 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

      const animateConfetti = () => {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiPieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          if (p.y > confettiCanvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * confettiCanvas.width;
          }
          confettiCtx.save();
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate(p.rot);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          confettiCtx.restore();
        });
        confettiAnimId = requestAnimationFrame(animateConfetti);
      };
      confettiAnimId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    /* ===========================================================
       8. RESPONSIVE RESIZE HANDLER
