<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Interactive Presentation Whiteboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* =========================================================
       CLEAN CLASSROOM PRESENTATION WHITEBOARD THEME
       ========================================================= */
    :root {
      --font-comic: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: var(--font-comic);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
    }

    /* Drawing Canvas */
    .draw-canvas {
      touch-action: none;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
    }
    .draw-canvas.eraser-cursor {
      cursor: cell;
    }

    /* Draggable Subject Card */
    .subject-card {
      touch-action: none;
      cursor: grab;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
    }
    .subject-card.is-dragging {
      cursor: grabbing;
      transition: none !important;
      box-shadow: 0 20px 38px rgba(15, 23, 42, 0.24) !important;
      transform: scale(1.04);
      z-index: 9999 !important;
    }
    .subject-card.on-board {
      position: fixed;
      width: 196px;
      height: 176px;
      border-width: 3px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
    }
    @media (min-width: 1024px) {
      .subject-card.on-board {
        width: 230px;
        height: 204px;
      }
    }

    /* Side Dock Highlight when Returning a Card */
    .dock-drop-active {
      background-color: #e0f2fe !important;
      border-color: #0284c7 !important;
      box-shadow: inset 0 0 0 3px #38bdf8;
    }

    /* Toolbar Active States */
    .tool-active {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%) !important;
      color: #1f2937 !important;
      border-color: #b45309 !important;
      box-shadow: 0 3px 0 #b45309;
    }
    .swatch-active {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
      transform: scale(1.16);
    }
    .size-active {
      background-color: #0284c7 !important;
      color: #ffffff !important;
      border-color: #0369a1 !important;
    }

    /* Subtle button press */
    .btn-press {
      transition: transform 0.08s ease, filter 0.12s ease;
    }
    .btn-press:active {
      transform: translateY(2px);
    }

    /* Empty slot placeholder when card is dragged onto the board */
    .dock-slot {
      min-height: 76px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Spinning Wheel Button & Animations */
    .btn-spin {
      background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 7px 0 #9f1239, 0 14px 28px rgba(159, 18, 57, 0.32);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    }
    .btn-spin:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }
    .btn-spin:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #9f1239, 0 6px 14px rgba(159, 18, 57, 0.3);
    }
    .btn-spin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.84) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .wheel-pointer {
      transition: transform 0.06s ease-out;
      transform-origin: 50% 15%;
    }
    .wheel-pointer.tick {
      transform: rotate(-18deg);
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col p-2 sm:p-3 gap-2 text-slate-800">

  <!-- =========================================================
       SCREEN 1: BIG 8-SUBJECT SPINNING WHEEL (BEFORE WHITEBOARD)
       ========================================================= -->
  <section
    id="screen-wheel"
    class="flex-1 min-h-0 w-full bg-white rounded-3xl border-4 border-sky-300 shadow-xl flex flex-col items-center justify-between p-3 sm:p-5 relative overflow-hidden"
  >
    <!-- Top Bar: Title & Quick Teacher Controls -->
    <header class="w-full flex flex-wrap items-center justify-between gap-2 z-10 shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-2xl sm:text-3xl">🎡</span>
        <h1 class="text-xl sm:text-3xl font-bold text-slate-800 tracking-wide">
          Spin a Subject!
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="btn-wheel-labels"
          onclick="toggleWheelLabels()"
          class="btn-press px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-bold text-xs sm:text-sm cursor-pointer"
          title="Show or hide subject names on the wheel"
        >
          👁️ Names: On
        </button>
        <button
          id="btn-wheel-mute"
          onclick="toggleWheelMute()"
          class="btn-press px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer"
          title="Toggle Sound"
        >
          🔊 Sound
        </button>
        <button
          onclick="showWhiteboardScreen(null)"
          class="btn-press px-3.5 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs sm:text-sm shadow cursor-pointer"
          title="Go directly to the whiteboard"
        >
          Whiteboard ➔
        </button>
      </div>
    </header>

    <!-- Center: Big Spinning Wheel + Top Pointer -->
    <div id="wheel-stage" class="flex-1 min-h-0 w-full flex items-center justify-center relative my-1">
      <div id="wheel-wrapper" class="relative flex items-center justify-center">
        <!-- Top Pointer Arrow -->
        <div
          id="wheel-pointer"
          class="wheel-pointer absolute -top-3 sm:-top-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none drop-shadow-md"
        >
          <svg width="46" height="52" viewBox="0 0 46 52">
            <polygon points="23,50 4,8 42,8" fill="#ef4444" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="23" cy="12" r="7" fill="#fef08a" stroke="#b91c1c" stroke-width="3"/>
          </svg>
        </div>

        <!-- Wheel Canvas -->
        <canvas id="wheel-canvas" class="block cursor-pointer" onclick="spinWheel()"></canvas>
      </div>
    </div>

    <!-- Bottom: Big SPIN Button -->
    <div class="shrink-0 flex items-center justify-center pb-1 z-10">
      <button
        id="btn-spin"
        onclick="spinWheel()"
        class="btn-spin text-white text-2xl sm:text-3xl font-bold px-12 sm:px-16 py-3 sm:py-3.5 rounded-full tracking-wider cursor-pointer flex items-center gap-3"
      >
        <span>🎯</span>
        <span>SPIN!</span>
      </button>
    </div>

    <!-- Result Modal Overlay After Wheel Stops -->
    <div
      id="wheel-result-modal"
      class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/55 backdrop-blur-sm p-4"
    >
      <div class="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl border-4 border-sky-400 animate-pop relative">
        <div class="inline-block px-3.5 py-1 rounded-full bg-amber-200 text-amber-900 font-bold text-xs uppercase tracking-wider mb-2">
          🎉 Your Subject Is...
        </div>

        <!-- Chosen Subject Picture -->
        <div
          id="wheel-result-svg"
          class="w-full h-48 sm:h-56 flex items-center justify-center bg-slate-50 rounded-2xl border-2 border-slate-200 p-3 mb-3"
        ></div>

        <!-- Optional Word Display (hidden if Names: Off) -->
        <h2 id="wheel-result-title" class="text-3xl sm:text-4xl font-bold text-sky-600 mb-4">
          Art
        </h2>

        <div class="flex flex-wrap items-center justify-center gap-3">
          <button
            onclick="closeWheelResultAndSpin()"
            class="btn-press px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm sm:text-base cursor-pointer"
          >
            🔄 Spin Again
          </button>
          <button
            onclick="goToWhiteboardWithSpunSubject()"
            class="btn-press px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-base sm:text-lg shadow-lg cursor-pointer"
          >
            ✏️ Write on Whiteboard ➔
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- =========================================================
       SCREEN 2: MAIN PRESENTATION STAGE: SIDE DOCK + WHITEBOARD
       ========================================================= -->
  <div id="screen-whiteboard" class="hidden flex-1 min-h-0 flex-row gap-2.5 sm:gap-3">

    <!-- LEFT SIDE DOCK: 8 DRAGGABLE SUBJECT PICTURES -->
    <aside
      id="side-dock"
      class="w-36 sm:w-48 lg:w-56 shrink-0 bg-white rounded-3xl border-2 border-slate-200 shadow-lg p-2 sm:p-2.5 flex flex-col gap-2 transition-colors duration-150"
    >
      <!-- Dock Header -->
      <div class="shrink-0 flex items-center justify-between px-1">
        <span class="text-xs sm:text-sm font-bold text-slate-600 tracking-wide">
          📚 Subjects
        </span>
        <button
          onclick="returnAllCards()"
          class="btn-press text-[11px] sm:text-xs font-bold px-2 py-1 rounded-lg bg-sky-100 hover:bg-sky-200 text-sky-800 border border-sky-300 cursor-pointer"
          title="Return all pictures to the side"
        >
          ↩ Return All
        </button>
      </div>

      <!-- 8 Picture Slots (2 Columns x 4 Rows on medium+, 1 Column scroll on tiny screens) -->
      <div id="dock-grid" class="flex-1 min-h-0 grid grid-cols-1 sm:grid-cols-2 gap-2 overflow-y-auto pr-0.5 content-start">
        <!-- Populated dynamically with 8 subject slots -->
      </div>

      <!-- Helper Hint -->
      <div id="dock-hint" class="shrink-0 text-center text-[11px] text-slate-400 font-bold leading-tight px-1">
        Drag to center to spell • Drag back here to return
      </div>
    </aside>

    <!-- RIGHT MAIN AREA: ONE WHOLE 4-LINE HANDWRITING WHITEBOARD -->
    <main
      id="whiteboard-container"
      class="flex-1 min-w-0 min-h-0 bg-white rounded-3xl border-4 border-sky-300 shadow-xl flex flex-col overflow-hidden relative"
    >
      <!-- Handwriting Surface + Guidelines + Canvas -->
      <div id="board-surface" class="relative flex-1 min-h-0 bg-white overflow-hidden">

        <!-- 4-Line Primary Handwriting Guidelines (SVG Layer Behind Canvas) -->
        <svg id="guidelines-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0" aria-hidden="true">
          <!-- Rendered dynamically based on selected line mode (3 rows, 2 large rows, or blank) -->
        </svg>

        <!-- Transparent Multi-Touch / Mouse Drawing Canvas -->
        <canvas id="main-canvas" class="draw-canvas relative z-10"></canvas>
      </div>

      <!-- BOTTOM PRESENTATION TOOLBAR -->
      <footer class="shrink-0 bg-slate-50 border-t-2 border-slate-200 px-2.5 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20">

        <!-- Left: Pen & Eraser -->
        <div class="flex items-center gap-1.5">
          <button id="btn-pen" onclick="selectPen()" class="btn-press tool-active px-3 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
            ✏️ Pen
          </button>
          <button id="btn-eraser" onclick="selectEraser()" class="btn-press px-3 py-1.5 rounded-xl bg-white border-2 border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer">
            🧽 Eraser
          </button>
        </div>

        <!-- Center-Left: 6 Color Swatches -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button onclick="setColor('#1f2937', this)" class="swatch swatch-active w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-slate-800 border-2 border-white shadow cursor-pointer" title="Black"></button>
          <button onclick="setColor('#2563eb', this)" class="swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-blue-600 border-2 border-white shadow cursor-pointer" title="Blue"></button>
          <button onclick="setColor('#ef4444', this)" class="swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-red-500 border-2 border-white shadow cursor-pointer" title="Red"></button>
          <button onclick="setColor('#ec4899', this)" class="swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-pink-500 border-2 border-white shadow cursor-pointer" title="Pink"></button>
          <button onclick="setColor('#16a34a', this)" class="swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-green-600 border-2 border-white shadow cursor-pointer" title="Green"></button>
          <button onclick="setColor('#9333ea', this)" class="swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-purple-600 border-2 border-white shadow cursor-pointer" title="Purple"></button>
        </div>

        <!-- Center-Right: Pen Sizes (S / M / L) -->
        <div class="flex items-center gap-1">
          <button onclick="setSize(0, this)" class="size-btn w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-white border border-slate-300 text-slate-700 font-bold text-xs cursor-pointer" title="Small">S</button>
          <button onclick="setSize(1, this)" class="size-btn size-active w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-white border border-slate-300 text-slate-700 font-bold text-xs cursor-pointer" title="Medium">M</button>
        <!-- Right: Presentation Controls (Wheel, Lines, Show/Hide Words, Undo, Clear) -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <button onclick="showWheelScreen()" class="btn-press px-2.5 py-1.5 rounded-xl bg-pink-100 hover:bg-pink-200 border border-pink-300 text-pink-900 font-bold text-xs sm:text-sm cursor-pointer" title="Return to the spinning wheel">
            🎡 Spin Wheel
          </button>
          <button id="btn-lines" onclick="cycleLineMode()" class="btn-press px-2.5 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 border border-sky-300 text-sky-900 font-bold text-xs sm:text-sm cursor-pointer" title="Change handwriting lines">
            📏 Lines: 3 Rows
          </button>
          <button id="btn-labels" onclick="toggleGlobalLabels()" class="btn-press px-2.5 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-900 font-bold text-xs sm:text-sm cursor-pointer" title="Show or hide spelling words">
            👁️ Words: Off
          </button>
          <button onclick="undoStroke()" class="btn-press px-2.5 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 border border-slate-300 text-slate-800 font-bold text-xs sm:text-sm cursor-pointer" title="Undo last stroke">
            ↩ Undo
          </button>
          <button onclick="clearBoard()" class="btn-press px-2.5 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-700 font-bold text-xs sm:text-sm cursor-pointer" title="Clear whiteboard ink">
            🗑️ Clear
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div id="floating-layer" class="hidden fixed inset-0 pointer-events-none z-30"></div>

    /* ===========================================================
       1B. SPINNING WHEEL LOGIC, PHYSICS & AUDIO EFFECTS
       =========================================================== */
    const screenWheel = document.getElementById('screen-wheel');
    const screenWhiteboard = document.getElementById('screen-whiteboard');
    const wheelStage = document.getElementById('wheel-stage');
    const wheelCanvas = document.getElementById('wheel-canvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    const wheelPointerEl = document.getElementById('wheel-pointer');
    const wheelResultModal = document.getElementById('wheel-result-modal');
    const btnSpin = document.getElementById('btn-spin');

    let wheelAngle = 0;           // Current rotation in radians
    let isSpinning = false;
    let showWheelLabels = true;
    let isWheelMuted = false;
    let lastSpunSubjectId = null;
    let wheelAudioCtx = null;

    function playWheelSound(type) {
      if (isWheelMuted) return;
      try {
        if (!wheelAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) wheelAudioCtx = new AudioCtx();
        }
        if (!wheelAudioCtx) return;
        if (wheelAudioCtx.state === 'suspended') wheelAudioCtx.resume();

        const now = wheelAudioCtx.currentTime;
        if (type === 'tick') {
          const osc = wheelAudioCtx.createOscillator();
          const gain = wheelAudioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(720, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(wheelAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.045);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = wheelAudioCtx.createOscillator();
            const gain = wheelAudioCtx.createGain();
            osc.type = 'triangle';
            const t = now + idx * 0.08;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(wheelAudioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.27);
          });
        }
      } catch (err) {
        // Ignore audio errors on restricted devices
      }
    }

    function toggleWheelMute() {
      isWheelMuted = !isWheelMuted;
      document.getElementById('btn-wheel-mute').textContent = isWheelMuted ? '🔇 Muted' : '🔊 Sound';
    }

    function toggleWheelLabels() {
      showWheelLabels = !showWheelLabels;
      const btn = document.getElementById('btn-wheel-labels');
      btn.textContent = showWheelLabels ? '👁️ Names: On' : '👁️ Names: Off';
      btn.classList.toggle('bg-amber-300', !showWheelLabels);
      btn.classList.toggle('bg-amber-100', showWheelLabels);
      drawWheel();
    }

    function resizeWheelCanvas() {
      if (screenWheel.classList.contains('hidden')) return;
      const rect = wheelStage.getBoundingClientRect();
      const size = Math.max(240, Math.min(rect.width - 16, rect.height - 12, 560));
      const dpr = window.devicePixelRatio || 1;
      wheelCanvas.style.width = `${size}px`;
      wheelCanvas.style.height = `${size}px`;
      wheelCanvas.width = Math.floor(size * dpr);
      wheelCanvas.height = Math.floor(size * dpr);
      wheelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawWheel();
    }

    function drawWheel() {
      const size = parseFloat(wheelCanvas.style.width) || 360;
      const cx = size / 2;
      const cy = size / 2;
      const radius = size / 2 - 14;
      const count = SUBJECTS.length;
      const sliceAngle = (Math.PI * 2) / count;

      wheelCtx.clearRect(0, 0, size, size);

      // Outer decorative rim shadow & border
      wheelCtx.save();
      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, radius + 8, 0, Math.PI * 2);
      wheelCtx.fillStyle = '#0f172a';
      wheelCtx.fill();
      wheelCtx.lineWidth = 4;
      wheelCtx.strokeStyle = '#38bdf8';
      wheelCtx.stroke();
      wheelCtx.restore();

      // Draw 8 Subject Wedges
      SUBJECTS.forEach((subject, i) => {
        const startA = wheelAngle + i * sliceAngle;
        const endA = startA + sliceAngle;
        const midA = startA + sliceAngle / 2;

        wheelCtx.save();
        wheelCtx.beginPath();
        wheelCtx.moveTo(cx, cy);
        wheelCtx.arc(cx, cy, radius, startA, endA);
        wheelCtx.closePath();
        wheelCtx.fillStyle = subject.wheelColor;
        wheelCtx.fill();
        wheelCtx.lineWidth = 3;
        wheelCtx.strokeStyle = '#ffffff';
        wheelCtx.stroke();

        // Draw Emoji & Subject Name along the slice radius
        wheelCtx.translate(cx, cy);
        wheelCtx.rotate(midA);
        wheelCtx.textAlign = 'center';
        wheelCtx.textBaseline = 'middle';

        const emojiSize = Math.max(22, Math.round(radius * 0.17));
        const fontSize = Math.max(12, Math.round(radius * 0.088));

        if (showWheelLabels) {
          wheelCtx.font = `${emojiSize}px "Comic Sans MS", sans-serif`;
          wheelCtx.fillText(subject.emoji, radius * 0.72, 0);

          wheelCtx.font = `bold ${fontSize}px "Comic Sans MS", "Chalkboard SE", cursive, sans-serif`;
          wheelCtx.fillStyle = '#0f172a';
          // Split "Social Studies" into 2 neat lines on the wedge
          if (subject.label.includes(' ')) {
            const parts = subject.label.split(' ');
            wheelCtx.fillText(parts[0], radius * 0.43, -fontSize * 0.55);
            wheelCtx.fillText(parts[1], radius * 0.43, fontSize * 0.6);
          } else {
            wheelCtx.fillText(subject.label, radius * 0.44, 0);
          }
        } else {
          // Pure picture/emoji mode for spelling challenge
          wheelCtx.font = `${Math.round(emojiSize * 1.45)}px "Comic Sans MS", sans-serif`;
          wheelCtx.fillText(subject.emoji, radius * 0.62, 0);
        }
        wheelCtx.restore();

        // Rim Peg Dot at each slice boundary
        const pegX = cx + Math.cos(startA) * (radius + 2);
        const pegY = cy + Math.sin(startA) * (radius + 2);
        wheelCtx.beginPath();
        wheelCtx.arc(pegX, pegY, 4.5, 0, Math.PI * 2);
        wheelCtx.fillStyle = '#fef08a';
        wheelCtx.fill();
        wheelCtx.lineWidth = 1.5;
        wheelCtx.strokeStyle = '#92400e';
        wheelCtx.stroke();
      });

      // Center Hub Cap
      wheelCtx.save();
      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, Math.max(24, radius * 0.16), 0, Math.PI * 2);
      wheelCtx.fillStyle = '#ffffff';
      wheelCtx.fill();
      wheelCtx.lineWidth = 5;
      wheelCtx.strokeStyle = '#0284c7';
      wheelCtx.stroke();

      wheelCtx.fillStyle = '#0284c7';
      wheelCtx.font = `bold ${Math.max(12, Math.round(radius * 0.075))}px "Comic Sans MS", sans-serif`;
      wheelCtx.textAlign = 'center';
      wheelCtx.textBaseline = 'middle';
      wheelCtx.fillText('SPIN', cx, cy);
      wheelCtx.restore();
    }

    function getWinningIndex(angle) {
      const count = SUBJECTS.length;
      const sliceAngle = (Math.PI * 2) / count;
      // Top pointer sits at -PI/2 (1.5 * PI)
      const normalized = (1.5 * Math.PI - (angle % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2);
      return Math.floor(normalized / sliceAngle) % count;
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      btnSpin.disabled = true;

      const startAngle = wheelAngle;
      // 6 to 9 full rotations + random landing offset
      const extraSpins = (6 + Math.random() * 3) * Math.PI * 2;
      const randomOffset = Math.random() * Math.PI * 2;
      const totalDelta = extraSpins + randomOffset;
      const duration = 4200; // 4.2 seconds
      const startTime = performance.now();
      let lastSliceIdx = getWinningIndex(wheelAngle);

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        // Smooth quartic ease-out
        const eased = 1 - Math.pow(1 - progress, 4);
        wheelAngle = startAngle + totalDelta * eased;
        drawWheel();

        // Trigger peg tick sound & pointer bounce whenever a slice boundary passes the top pointer
        const currentSliceIdx = getWinningIndex(wheelAngle);
        if (currentSliceIdx !== lastSliceIdx) {
          lastSliceIdx = currentSliceIdx;
          playWheelSound('tick');
          wheelPointerEl.classList.add('tick');
          setTimeout(() => wheelPointerEl.classList.remove('tick'), 55);
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          wheelAngle = wheelAngle % (Math.PI * 2);
          isSpinning = false;
          btnSpin.disabled = false;
          const winner = SUBJECTS[getWinningIndex(wheelAngle)];
          showWheelResult(winner);
        }
      }

      requestAnimationFrame(step);
    }

    function showWheelResult(subject) {
      lastSpunSubjectId = subject.id;
      playWheelSound('win');
      document.getElementById('wheel-result-svg').innerHTML = subject.svg;
      const titleEl = document.getElementById('wheel-result-title');
      if (showWheelLabels) {
        titleEl.textContent = subject.label;
        titleEl.classList.remove('hidden');
      } else {
        titleEl.textContent = 'Spell this subject!';
        titleEl.classList.remove('hidden');
      }
      wheelResultModal.classList.remove('hidden');
      wheelResultModal.classList.add('flex');
    }

    function closeWheelResultAndSpin() {
      wheelResultModal.classList.add('hidden');
      wheelResultModal.classList.remove('flex');
      spinWheel();
    }

    function goToWhiteboardWithSpunSubject() {
      wheelResultModal.classList.add('hidden');
      wheelResultModal.classList.remove('flex');
      showWhiteboardScreen(lastSpunSubjectId);
    }

    function showWheelScreen() {
      screenWhiteboard.classList.add('hidden');
      screenWhiteboard.classList.remove('flex');
      floatingLayer.classList.add('hidden');

      wheelResultModal.classList.add('hidden');
      wheelResultModal.classList.remove('flex');

      screenWheel.classList.remove('hidden');
      screenWheel.classList.add('flex');
      requestAnimationFrame(() => resizeWheelCanvas());
    }

    function showWhiteboardScreen(autoPlaceSubjectId) {
      screenWheel.classList.add('hidden');
      screenWheel.classList.remove('flex');
      wheelResultModal.classList.add('hidden');
      wheelResultModal.classList.remove('flex');

      screenWhiteboard.classList.remove('hidden');
      screenWhiteboard.classList.add('flex');
      floatingLayer.classList.remove('hidden');

      requestAnimationFrame(() => {
        resizeCanvas();
        if (autoPlaceSubjectId) {
          returnAllCards();
          placeCardOnBoardCenter(autoPlaceSubjectId);
        }
      });
    }

    function placeCardOnBoardCenter(id) {
      const entry = cardRegistry.get(id);
      if (!entry) return;
      const { cardEl } = entry;
      const boardRect = boardSurface.getBoundingClientRect();
      const isDesktop = window.innerWidth >= 1024;
      const cardW = isDesktop ? 230 : 196;

      entry.onBoard = true;
      entry.individualReveal = false;
      cardEl.classList.add('on-board');
      cardEl.querySelector('.card-controls').classList.remove('hidden');
      floatingLayer.appendChild(cardEl);

      topZIndex++;
      cardEl.style.zIndex = topZIndex;
      // Place neatly at the top-center of the whiteboard so writing rows below stay clear
      cardEl.style.left = `${Math.round(boardRect.left + (boardRect.width - cardW) / 2)}px`;
      cardEl.style.top = `${Math.round(boardRect.top + 14)}px`;
      updateCardWordVisibility(id);
    }

    /* ===========================================================
       2. DRAGGABLE SUBJECT CARDS (SIDE DOCK <-> WHITEBOARD)
       =========================================================== */
    const sideDock = document.getElementById('side-dock');
    const dockGrid = document.getElementById('dock-grid');
    const floatingLayer = document.getElementById('floating-layer');
    const boardSurface = document.getElementById('board-surface');

    let showGlobalLabels = false;
    let topZIndex = 40;
    const cardRegistry = new Map(); // id -> { subject, slotEl, cardEl, onBoard, individualReveal }

    function buildDock() {
      dockGrid.innerHTML = '';
      SUBJECTS.forEach((subject) => {
        // Home slot in the side dock
        const slotEl = document.createElement('div');
        slotEl.className = 'dock-slot aspect-square w-full';
        slotEl.dataset.slotId = subject.id;

        // Draggable Picture Card
        const cardEl = document.createElement('div');
        cardEl.className = `subject-card pointer-events-auto w-full h-full rounded-2xl border-2 ${subject.accent} bg-white shadow-sm p-1.5 flex flex-col items-center justify-center relative`;
        cardEl.dataset.subjectId = subject.id;

        cardEl.innerHTML = `
          <!-- Quick Controls (Visible only when placed on the whiteboard) -->
          <div class="card-controls hidden absolute -top-3 -right-3 flex items-center gap-1 z-20">
            <button
              type="button"
              data-action="toggle-word"
              class="w-8 h-8 rounded-full bg-amber-300 hover:bg-amber-400 border-2 border-white text-slate-900 font-bold text-sm shadow-md flex items-center justify-center cursor-pointer"
              title="Show / Hide spelling"
            >👁️</button>
            <button
              type="button"
              data-action="return-card"
              class="w-8 h-8 rounded-full bg-sky-500 hover:bg-sky-600 border-2 border-white text-white font-bold text-sm shadow-md flex items-center justify-center cursor-pointer"
              title="Return to side"
            >↩</button>
          </div>

          <!-- Picture SVG -->
          <div class="w-full flex-1 min-h-0 flex items-center justify-center pointer-events-none p-0.5">
            ${subject.svg}
          </div>

          <!-- Optional Spelling Word Label (Hidden by default for spelling quiz) -->
          <div class="card-word hidden shrink-0 mt-1 px-2.5 py-0.5 rounded-full bg-slate-800 text-white text-xs sm:text-base font-bold tracking-wide pointer-events-none">
            ${subject.label}
          </div>
        `;

        slotEl.appendChild(cardEl);
        dockGrid.appendChild(slotEl);

        cardRegistry.set(subject.id, {
          subject,
          slotEl,
          cardEl,
          onBoard: false,
          individualReveal: false
        });

        bindCardDrag(subject.id);
      });
    }

    function updateCardWordVisibility(id) {
      const entry = cardRegistry.get(id);
      if (!entry) return;
      const wordEl = entry.cardEl.querySelector('.card-word');
      const shouldShow = showGlobalLabels || entry.individualReveal;
      wordEl.classList.toggle('hidden', !shouldShow);
    }

    function toggleGlobalLabels() {
      showGlobalLabels = !showGlobalLabels;
      const btn = document.getElementById('btn-labels');
      btn.textContent = showGlobalLabels ? '👁️ Words: On' : '👁️ Words: Off';
      btn.classList.toggle('bg-amber-300', showGlobalLabels);
      btn.classList.toggle('bg-amber-100', !showGlobalLabels);
      cardRegistry.forEach((_, id) => updateCardWordVisibility(id));
    }

    function returnCardToDock(id) {
      const entry = cardRegistry.get(id);
      if (!entry) return;
      const { cardEl, slotEl } = entry;

      entry.onBoard = false;
      entry.individualReveal = false;
      cardEl.classList.remove('on-board', 'is-dragging');
      cardEl.style.left = '';
      cardEl.style.top = '';
      cardEl.style.zIndex = '';
      cardEl.querySelector('.card-controls').classList.add('hidden');

      slotEl.appendChild(cardEl);
      updateCardWordVisibility(id);
    }

    function returnAllCards() {
      cardRegistry.forEach((_, id) => returnCardToDock(id));
    }

    function bindCardDrag(id) {
      const entry = cardRegistry.get(id);
      const cardEl = entry.cardEl;

      // Handle quick action buttons inside the card without triggering drag
      cardEl.addEventListener('pointerdown', (e) => {
        const actionBtn = e.target.closest('button[data-action]');
        if (actionBtn) {
          e.stopPropagation();
          e.preventDefault();
          const action = actionBtn.dataset.action;
          if (action === 'return-card') {
            returnCardToDock(id);
          } else if (action === 'toggle-word') {
            entry.individualReveal = !entry.individualReveal;
            updateCardWordVisibility(id);
          }
          return;
        }

        e.preventDefault();
        e.stopPropagation();

        // Capture pointer for reliable smooth dragging on touch & mouse
        try { cardEl.setPointerCapture(e.pointerId); } catch (err) {}

        const startRect = cardEl.getBoundingClientRect();
        const isDesktop = window.innerWidth >= 1024;
        const targetW = isDesktop ? 230 : 196;
        const targetH = isDesktop ? 204 : 176;

        // If coming from the side dock, promote to floating presentation size centered under pointer
        let offsetX, offsetY;
        if (!entry.onBoard) {
          entry.onBoard = true;
          cardEl.classList.add('on-board');
          cardEl.querySelector('.card-controls').classList.remove('hidden');
          floatingLayer.appendChild(cardEl);

          offsetX = targetW / 2;
          offsetY = targetH / 2;
          cardEl.style.left = `${e.clientX - offsetX}px`;
          cardEl.style.top = `${e.clientY - offsetY}px`;
        } else {
          offsetX = e.clientX - startRect.left;
          offsetY = e.clientY - startRect.top;
        }

        topZIndex++;
        cardEl.style.zIndex = topZIndex;
        cardEl.classList.add('is-dragging');

        const onPointerMove = (moveEvent) => {
          moveEvent.preventDefault();
          const x = moveEvent.clientX - offsetX;
          const y = moveEvent.clientY - offsetY;
          cardEl.style.left = `${x}px`;
          cardEl.style.top = `${y}px`;

          // Highlight the side dock if the pointer is hovering back over it
          const dockRect = sideDock.getBoundingClientRect();
          const overDock = moveEvent.clientX <= dockRect.right + 16;
          sideDock.classList.toggle('dock-drop-active', overDock);
        };

        const onPointerUp = (upEvent) => {
          cardEl.classList.remove('is-dragging');
          sideDock.classList.remove('dock-drop-active');
          cardEl.removeEventListener('pointermove', onPointerMove);
          cardEl.removeEventListener('pointerup', onPointerUp);
          cardEl.removeEventListener('pointercancel', onPointerUp);

          // Check if dropped back over the side dock -> snap cleanly home
          const dockRect = sideDock.getBoundingClientRect();
          if (upEvent.clientX <= dockRect.right + 16) {
            returnCardToDock(id);
            return;
          }

          // Otherwise keep neatly clamped within the visible viewport
          const rect = cardEl.getBoundingClientRect();
          const minX = dockRect.right + 8;
          const maxX = Math.max(minX, window.innerWidth - rect.width - 12);
          const minY = 12;
          const maxY = Math.max(minY, window.innerHeight - rect.height - 64);

          const clampedX = Math.min(Math.max(rect.left, minX), maxX);
          const clampedY = Math.min(Math.max(rect.top, minY), maxY);
          cardEl.style.left = `${clampedX}px`;
          cardEl.style.top = `${clampedY}px`;
        };

        cardEl.addEventListener('pointermove', onPointerMove);
        cardEl.addEventListener('pointerup', onPointerUp);
        cardEl.addEventListener('pointercancel', onPointerUp);
      });
    }

    /* ===========================================================
       3. 4-LINE PRIMARY HANDWRITING GUIDELINES (SVG LAYER)
       =========================================================== */
    const guidelinesSvg = document.getElementById('guidelines-svg');
    // Line Modes: 0 = 3 Rows (default), 1 = 2 Large Rows, 2 = Blank Whiteboard
    const LINE_MODES = [
      { name: '3 Rows', rows: [
        { top: 9, mid: 16, base: 23, desc: 30 },
        { top: 39.5, mid: 46.5, base: 53.5, desc: 60.5 },
        { top: 70, mid: 77, base: 84, desc: 91 }
      ]},
      { name: '2 Big Rows', rows: [
        { top: 14, mid: 24, base: 34, desc: 44 },
        { top: 56, mid: 66, base: 76, desc: 86 }
      ]},
      { name: 'Blank', rows: [] }
    ];
    let currentLineMode = 0;

    function renderGuidelines() {
      const mode = LINE_MODES[currentLineMode];
      document.getElementById('btn-lines').textContent = `📏 Lines: ${mode.name}`;

      let markup = '';
      mode.rows.forEach((r) => {
        markup += `
          <line x1="2.5%" y1="${r.top}%" x2="97.5%" y2="${r.top}%" stroke="#9ca3af" stroke-width="1.5" />
          <line x1="2.5%" y1="${r.mid}%" x2="97.5%" y2="${r.mid}%" stroke="#757575" stroke-width="1.5" stroke-dasharray="2.5 4" />
          <line x1="2.5%" y1="${r.base}%" x2="97.5%" y2="${r.base}%" stroke="#00b4f0" stroke-width="4" />
          <line x1="2.5%" y1="${r.desc}%" x2="97.5%" y2="${r.desc}%" stroke="#9ca3af" stroke-width="1.5" />
        `;
      });
      guidelinesSvg.innerHTML = markup;
    }

    function cycleLineMode() {
      currentLineMode = (currentLineMode + 1) % LINE_MODES.length;
      renderGuidelines();
    }

    /* ===========================================================
       4. MULTI-TOUCH & MOUSE WHITEBOARD DRAWING + UNDO
       =========================================================== */
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');

    const PEN_SIZES = [4, 8, 15];
    const ERASER_SIZES = [20, 34, 52];

    const drawState = {
      mode: 'pen',       // 'pen' | 'eraser'
      color: '#1f2937',
      sizeIdx: 1,        // 0 = S, 1 = M, 2 = L
      activePointers: new Map(),
      history: []        // Canvas snapshots for Undo (up to 25 steps)
    };

    function saveHistorySnapshot() {
      if (canvas.width <= 0 || canvas.height <= 0) return;
      const snap = document.createElement('canvas');
      snap.width = canvas.width;
      snap.height = canvas.height;
      snap.getContext('2d').drawImage(canvas, 0, 0);
      drawState.history.push(snap);
      if (drawState.history.length > 25) {
        drawState.history.shift();
      }
    }

    function undoStroke() {
      if (drawState.history.length === 0) return;
      const prevSnap = drawState.history.pop();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(prevSnap, 0, 0);
    }

    function clearBoard() {
      saveHistorySnapshot();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function resizeCanvas() {
      const rect = boardSurface.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      if (canvas.width === width && canvas.height === height) return;

      let snapshot = null;
      if (canvas.width > 0 && canvas.height > 0) {
        snapshot = document.createElement('canvas');
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        snapshot.getContext('2d').drawImage(canvas, 0, 0);
      }

      canvas.width = width;
      canvas.height = height;

      if (snapshot) {
        ctx.drawImage(snapshot, 0, 0);
      }
    }

    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function drawDot(pt) {
      ctx.save();
      if (drawState.mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, ERASER_SIZES[drawState.sizeIdx] / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = drawState.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, PEN_SIZES[drawState.sizeIdx] / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSegment(from, to) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (drawState.mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = ERASER_SIZES[drawState.sizeIdx];
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = PEN_SIZES[drawState.sizeIdx];
        ctx.strokeStyle = drawState.color;
      }
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      ctx.restore();
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (drawState.activePointers.size === 0) {
        saveHistorySnapshot();
      }
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const pt = getCanvasPoint(e);
      drawState.activePointers.set(e.pointerId, pt);
      drawDot(pt);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!drawState.activePointers.has(e.pointerId)) return;
      e.preventDefault();
      const prev = drawState.activePointers.get(e.pointerId);
      const curr = getCanvasPoint(e);
      drawSegment(prev, curr);
      drawState.activePointers.set(e.pointerId, curr);
    });

    const endStroke = (e) => {
      if (drawState.activePointers.has(e.pointerId)) {
        drawState.activePointers.delete(e.pointerId);
      }
    };
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    // Toolbar controls
    function selectPen() {
      drawState.mode = 'pen';
      canvas.classList.remove('eraser-cursor');
      document.getElementById('btn-pen').classList.add('tool-active');
      document.getElementById('btn-eraser').classList.remove('tool-active');
    }

    function selectEraser() {
      drawState.mode = 'eraser';
      canvas.classList.add('eraser-cursor');
      document.getElementById('btn-eraser').classList.add('tool-active');
      document.getElementById('btn-pen').classList.remove('tool-active');
    }

    function setColor(hex, btnEl) {
      drawState.color = hex;
      selectPen();
      document.querySelectorAll('.swatch').forEach(el => el.classList.remove('swatch-active'));
      if (btnEl) btnEl.classList.add('swatch-active');
    }

    function setSize(sizeIdx, btnEl) {
      drawState.sizeIdx = sizeIdx;
      document.querySelectorAll('.size-btn').forEach(el => el.classList.remove('size-active'));
      if (btnEl) btnEl.classList.add('size-active');
    }

    /* ===========================================================
       5. INITIALIZATION & RESPONSIVE RESIZE
       =========================================================== */
    window.addEventListener('load', () => {
      buildDock();
      renderGuidelines();
      resizeWheelCanvas();
    });

    window.addEventListener('resize', () => {
      resizeWheelCanvas();
      if (!screenWhiteboard.classList.contains('hidden')) {
        resizeCanvas();
      }
    });
  </script>
</body>
</html>
